<!-- Checkout history html-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Book Store</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <div class="history-wrapper">

        <div class="history-header">
            <h2 class="history-title">📋 My Order History</h2>
            <button class="btn-back" onclick="window.location.href='../home_page/customer_homepage.html'">← Back to Shopping</button>
        </div>

        <table class="order-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Books</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="order-history-body">
                <tr>
                    <td colspan="6" style="text-align:center;padding:20px;color:#7f8c8d;">Loading...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="checkout.js"></script>
</body>
</html>
